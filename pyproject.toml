[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quoin"
version = "0.3.0"
description = "Deterministic EPUB compiler"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
dev = ["ruff", "mypy"]

[project.scripts]
quoin = "quoin.cli:main"

[tool.setuptools]
packages = ["quoin"]

[tool.setuptools.package-data]
quoin = ["schemas/*.json"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# assemble.py builds EPUB XML/CSS/HTML as single-line template literals (one
# CSS block reaches 721 chars); splitting them by hand risks altering the
# exact bytes the fidelity contract depends on, so length is ignored here
# instead of hand-wrapped.
"quoin/assemble.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
disallow_untyped_defs = false
