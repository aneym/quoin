[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quoin"
version = "0.2.0"
description = "Deterministic EPUB compiler"
requires-python = ">=3.12"
dependencies = ["Pillow>=10"]

[project.scripts]
quoin = "quoin.cli:main"

[tool.setuptools]
packages = ["quoin"]

[tool.setuptools.package-data]
quoin = ["schemas/*.json"]
