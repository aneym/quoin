[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quoin"
version = "0.2.0"
description = "Deterministic EPUB compiler"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
dev = ["ruff", "mypy"]

[project.scripts]
quoin = "quoin.cli:main"

[tool.setuptools]
packages = ["quoin"]

[tool.setuptools.package-data]
quoin = ["schemas/*.json"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = false
disallow_untyped_defs = false
